<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Админка — MAX Raid Wiki</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }

body {
  font-family: 'Segoe UI', 'Consolas', monospace, sans-serif;
  background: #0d0d0d;
  color: #e6e6e6;
  min-height: 100vh;
  overflow-x: hidden;
}

.bg {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
  background: radial-gradient(circle at 50% 30%, #232323 0%, #141414 55%, #0d0d0d 100%);
}
.scanlines {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.028) 0px,
    rgba(255,255,255,0.028) 1px,
    transparent 1px,
    transparent 3px
  );
  animation: scan 8s linear infinite;
}
@keyframes scan {
  from { background-position-y: 0; }
  to   { background-position-y: 100px; }
}

.login-screen {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background: radial-gradient(ellipse at center, #1a0000 0%, #0a0a0a 70%);
}
.login-screen.hidden { display: none; }
.login-box {
  position: relative;
  width: min(420px, 100%);
  padding: 44px 32px 36px;
  background: rgba(10, 10, 10, 0.96);
  border: 1px solid #ff2b2b;
  border-radius: 8px;
  box-shadow: 0 0 40px rgba(255,0,0,0.4), 0 0 80px rgba(255,0,0,0.15), inset 0 0 40px rgba(255,0,0,0.06);
  text-align: center;
}
.login-icon {
  font-size: 48px;
  margin-bottom: 16px;
  filter: drop-shadow(0 0 12px #ff2b2b);
  animation: lockPulse 2s ease-in-out infinite;
}
@keyframes lockPulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.08); }
}
.login-title {
  color: #ff2b2b;
  font-size: 1.3rem;
  font-weight: 900;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 8px;
  text-shadow: 0 0 14px rgba(255,43,43,0.8);
}
.login-subtitle {
  color: #888;
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 26px;
}
.login-input {
  width: 100%;
  background: rgba(0,0,0,0.6);
  border: 1px solid #444;
  color: #fff;
  padding: 14px 16px;
  font-family: inherit;
  font-size: 1rem;
  letter-spacing: 0.1em;
  text-align: center;
  border-radius: 4px;
  margin-bottom: 14px;
  transition: all 0.25s ease;
}
.login-input:focus {
  outline: none;
  border-color: #ff2b2b;
  box-shadow: 0 0 18px rgba(255,43,43,0.6);
}
.login-btn {
  width: 100%;
  padding: 14px;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 900;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #fff;
  background: linear-gradient(135deg, #a30000 0%, #ff2b2b 100%);
  border: 2px solid #ff5a5a;
  border-radius: 6px;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(255,0,0,0.6);
  transition: all 0.25s ease;
}
.login-btn:hover { background: linear-gradient(135deg, #cc0000 0%, #ff4444 100%); }
.login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.login-error {
  color: #ff2b2b;
  font-size: 0.85rem;
  min-height: 20px;
  margin-top: 12px;
}

.admin-panel {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 20px 60px;
}
.admin-panel.hidden { display: none; }

.admin-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  padding-bottom: 18px;
  border-bottom: 1px solid #333;
}
.admin-title {
  color: #ff2b2b;
  font-size: clamp(1.4rem, 4vw, 2rem);
  font-weight: 900;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  text-shadow: 0 0 14px rgba(255,43,43,0.7);
}
.admin-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.btn {
  padding: 10px 18px;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s ease;
  border: 1px solid #444;
  background: rgba(255,255,255,0.04);
  color: #e6e6e6;
}
.btn:hover { background: rgba(255,255,255,0.1); border-color: #ff2b2b; }
.btn-primary {
  background: linear-gradient(135deg, #a30000 0%, #ff2b2b 100%);
  border-color: #ff5a5a;
  color: #fff;
  box-shadow: 0 0 14px rgba(255,43,43,0.5);
}
.btn-primary:hover {
  background: linear-gradient(135deg, #cc0000 0%, #ff4444 100%);
  box-shadow: 0 0 22px rgba(255,43,43,0.9);
}
.btn-danger {
  border-color: #ef4444;
  color: #ef4444;
}
.btn-danger:hover {
  background: rgba(239,68,68,0.15);
  box-shadow: 0 0 14px rgba(239,68,68,0.6);
}

.layout {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 20px;
  align-items: start;
}

.sidebar {
  background: rgba(15,15,15,0.7);
  border: 1px solid #333;
  border-radius: 6px;
  padding: 14px;
  max-height: calc(100vh - 160px);
  overflow-y: auto;
  position: sticky;
  top: 20px;
}
.sidebar h3 {
  color: #ff2b2b;
  font-size: 0.9rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid #333;
}
.list {
  list-style: none;
  display: grid;
  gap: 6px;
}
.list-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: rgba(255,255,255,0.02);
  border: 1px solid #2c2c2c;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 0.9rem;
}
.list-item:hover {
  background: rgba(255,43,43,0.08);
  border-color: #ff2b2b;
}
.list-item.active {
  background: rgba(255,43,43,0.15);
  border-color: #ff2b2b;
  box-shadow: 0 0 12px rgba(255,43,43,0.4);
}
.list-item .emoji {
  font-size: 18px;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 1px solid #ff2b2b;
  background: #0f0f0f;
  overflow: hidden;
  flex-shrink: 0;
}
.list-item .emoji img { width: 100%; height: 100%; object-fit: cover; }
.list-item .name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.list-item .cat-tag {
  font-size: 0.65rem;
  color: #666;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.editor {
  background: rgba(15,15,15,0.7);
  border: 1px solid #333;
  border-radius: 6px;
  padding: 20px;
}
.editor h3 {
  color: #ff2b2b;
  font-size: 1rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid #333;
}
.field {
  display: grid;
  gap: 6px;
  margin-bottom: 14px;
}
.field label {
  font-size: 0.75rem;
  color: #888;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.field input, .field select, .field textarea {
  width: 100%;
  background: rgba(0,0,0,0.5);
  border: 1px solid #444;
  color: #fff;
  padding: 10px 12px;
  font-family: inherit;
  font-size: 0.92rem;
  border-radius: 4px;
  transition: all 0.2s ease;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none;
  border-color: #ff2b2b;
  box-shadow: 0 0 12px rgba(255,43,43,0.5);
}
.field textarea {
  min-height: 180px;
  resize: vertical;
  font-family: 'Consolas', monospace;
  line-height: 1.5;
}
.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
}
.checkbox input {
  width: auto;
  accent-color: #ff2b2b;
}
.checkbox label {
  font-size: 0.9rem;
  color: #ccc;
  letter-spacing: 0;
  text-transform: none;
}

.editor-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid #333;
}

.status-msg {
  margin-top: 12px;
  padding: 10px 14px;
  border-radius: 4px;
  font-size: 0.9rem;
  display: none;
}
.status-msg.ok {
  display: block;
  background: rgba(34,197,94,0.15);
  border: 1px solid #22c55e;
  color: #22c55e;
}
.status-msg.err {
  display: block;
  background: rgba(239,68,68,0.15);
  border: 1px solid #ef4444;
  color: #ef4444;
}

.shame-box {
  margin-top: 10px;
  padding: 14px;
  background: rgba(255,43,43,0.06);
  border: 1px dashed #ff2b2b;
  border-radius: 4px;
}
.shame-box h4 {
  color: #ff2b2b;
  font-size: 0.8rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: static; max-height: 300px; }
  .row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="scanlines"></div>

  <div class="login-screen" id="login-screen">
    <div class="login-box">
      <div class="login-icon">⚙️</div>
      <div class="login-title">АДМИН-ПАНЕЛЬ</div>
      <div class="login-subtitle">MAX Raid Wiki</div>
      <input type="password" class="login-input" id="login-input"
             placeholder="Пароль администратора" autocomplete="off" />
      <button class="login-btn" id="login-btn">ВОЙТИ</button>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>

  <div class="admin-panel hidden" id="admin-panel">
    <div class="admin-header">
      <div class="admin-title">⚙️ АДМИН-ПАНЕЛЬ</div>
      <div class="admin-actions">
        <button class="btn btn-primary" id="new-btn">+ Новая статья</button>
        <button class="btn" id="view-site-btn">Открыть сайт</button>
        <button class="btn btn-danger" id="logout-btn">Выйти</button>
      </div>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <h3>Статьи</h3>
        <ul class="list" id="list"></ul>
      </aside>

      <main class="editor">
        <h3 id="editor-title">Выбери статью слева</h3>

        <form id="edit-form" style="display:none">
          <div class="row">
            <div class="field">
              <label>Категория</label>
              <select id="f-category">
                <option value="raiders">Рейдеры</option>
                <option value="antiraiders">Антирейдеры</option>
              </select>
            </div>
            <div class="field">
              <label>ID (латиницей, без пробелов)</label>
              <input type="text" id="f-page-id" placeholder="например: uotb" />
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label>Название</label>
              <input type="text" id="f-title" placeholder="UOTB" />
            </div>
            <div class="field">
              <label>Порядок сортировки</label>
              <input type="number" id="f-sort" value="999" />
            </div>
          </div>

          <div class="field">
            <label>Аватар (emoji или URL)</label>
            <input type="text" id="f-avatar" placeholder="👑 или https://..." />
          </div>

          <div class="row">
            <div class="field">
              <label>Статус</label>
              <input type="text" id="f-status" placeholder="жив" />
            </div>
            <div class="field">
              <label>Владелец</label>
              <input type="text" id="f-owner" placeholder="Пабло" />
            </div>
          </div>

          <div class="field">
            <label>Текст статьи (HTML разрешён)</label>
            <textarea id="f-content" placeholder="<p>Текст...</p>"></textarea>
          </div>

          <div class="checkbox">
            <input type="checkbox" id="f-secret" />
            <label for="f-secret">🔒 Секретная (позорная сторона при клике по названию)</label>
          </div>

          <div class="shame-box">
            <h4>Позорная сторона</h4>
            <div class="field">
              <label>Заголовок</label>
              <input type="text" id="f-shame-title" placeholder="ПОЗОРНЫЕ СТОРОНЫ..." />
            </div>
            <div class="field">
              <label>Текст</label>
              <textarea id="f-shame-text" style="min-height:80px" placeholder="Текст позора..."></textarea>
            </div>
            <div class="field">
              <label>Печать (красным)</label>
              <input type="text" id="f-shame-stamp" placeholder="НЕ СКРЫТЬ!" />
            </div>
          </div>

          <div class="editor-actions">
            <button type="submit" class="btn btn-primary">💾 Сохранить</button>
            <button type="button" class="btn btn-danger" id="delete-btn">🗑 Удалить</button>
          </div>

          <div class="status-msg" id="status-msg"></div>
        </form>
      </main>
    </div>
  </div>

<script>
const loginScreen = document.getElementById('login-screen');
const loginInput = document.getElementById('login-input');
const loginBtn = document.getElementById('login-btn');
const loginError = document.getElementById('login-error');
const adminPanel = document.getElementById('admin-panel');
const listEl = document.getElementById('list');
const editForm = document.getElementById('edit-form');
const editorTitle = document.getElementById('editor-title');
const statusMsg = document.getElementById('status-msg');

const fCategory = document.getElementById('f-category');
const fPageId = document.getElementById('f-page-id');
const fTitle = document.getElementById('f-title');
const fSort = document.getElementById('f-sort');
const fAvatar = document.getElementById('f-avatar');
const fStatus = document.getElementById('f-status');
const fOwner = document.getElementById('f-owner');
const fContent = document.getElementById('f-content');
const fSecret = document.getElementById('f-secret');
const fShameTitle = document.getElementById('f-shame-title');
const fShameText = document.getElementById('f-shame-text');
const fShameStamp = document.getElementById('f-shame-stamp');

let currentItems = [];
let currentIdx = -1;
let isNew = false;

function isImageUrl(s) { return typeof s === 'string' && /^(https?:)?\/\//i.test(s); }
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function renderAvatar(v, fb = '❓') {
  if (!v) return fb;
  if (isImageUrl(v)) return `<img src="${escapeHtml(v)}" onerror="this.replaceWith(document.createTextNode('${fb}'))" />`;
  return escapeHtml(v);
}

async function tryLogin() {
  const password = loginInput.value;
  if (!password) { loginError.textContent = 'Введите пароль'; return; }
  loginBtn.disabled = true;
  loginBtn.textContent = 'ПРОВЕРКА...';
  loginError.textContent = '';
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ password })
    });
    if (res.ok) {
      loginScreen.classList.add('hidden');
      adminPanel.classList.remove('hidden');
      loginInput.value = '';
      await loadList();
    } else {
      const d = await res.json().catch(() => ({}));
      loginError.textContent = d.error || 'Неверный пароль';
      loginInput.value = '';
      loginInput.focus();
    }
  } catch {
    loginError.textContent = 'Ошибка соединения';
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'ВОЙТИ';
  }
}
loginBtn.addEventListener('click', tryLogin);
loginInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

async function loadList() {
  try {
    const res = await fetch('/api/admin/wiki', { credentials: 'include' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    currentItems = await res.json();
    renderList();
  } catch (e) {
    listEl.innerHTML = `<li style="color:#ef4444">Ошибка: ${e.message}</li>`;
  }
}

function renderList() {
  if (!currentItems.length) {
    listEl.innerHTML = `<li style="color:#888">Пока нет статей</li>`;
    return;
  }
  listEl.innerHTML = currentItems.map((it, i) => `
    <li class="list-item ${i === currentIdx ? 'active' : ''}" data-idx="${i}">
      <span class="emoji">${renderAvatar(it.avatar)}</span>
      <span class="name">${escapeHtml(it.title)}</span>
      <span class="cat-tag">${it.category === 'raiders' ? 'рейд' : 'анти'}</span>
    </li>
  `).join('');
  listEl.querySelectorAll('.list-item').forEach(li => {
    li.addEventListener('click', () => selectItem(Number(li.dataset.idx)));
  });
}

function selectItem(idx) {
  currentIdx = idx;
  isNew = false;
  const it = currentItems[idx];
  editorTitle.textContent = `Редактирование: ${it.title}`;
  editForm.style.display = 'block';

  fCategory.value = it.category || 'raiders';
  fPageId.value = it.page_id || '';
  fTitle.value = it.title || '';
  fSort.value = it.sort_order ?? 999;
  fAvatar.value = it.avatar || '';
  fStatus.value = it.status || '';
  fOwner.value = it.owner || '';
  fContent.value = it.content || '';
  fSecret.checked = !!it.secret;
  fShameTitle.value = (it.shame && it.shame.title) || '';
  fShameText.value = (it.shame && it.shame.text) || '';
  fShameStamp.value = (it.shame && it.shame.stamp) || '';

  hideStatus();
  renderList();
}

function newItem() {
  currentIdx = -1;
  isNew = true;
  editorTitle.textContent = 'Новая статья';
  editForm.style.display = 'block';
  editForm.reset();
  fCategory.value = 'raiders';
  fPageId.value = '';
  fSort.value = 999;
  hideStatus();
  renderList();
}

function showStatus(text, ok = true) {
  statusMsg.textContent = text;
  statusMsg.className = 'status-msg ' + (ok ? 'ok' : 'err');
  setTimeout(() => { statusMsg.className = 'status-msg'; }, 4000);
}
function hideStatus() { statusMsg.className = 'status-msg'; }

editForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    category: fCategory.value,
    page_id: fPageId.value.trim(),
    title: fTitle.value.trim(),
    sort_order: Number(fSort.value) || 999,
    avatar: fAvatar.value.trim(),
    status: fStatus.value.trim(),
    owner: fOwner.value.trim(),
    content: fContent.value,
    secret: fSecret.checked
  };
  const st = fShameTitle.value.trim() || fShameText.value.trim() || fShameStamp.value.trim();
  if (st) {
    body.shame = {
      title: fShameTitle.value.trim(),
      text: fShameText.value.trim(),
      stamp: fShameStamp.value.trim()
    };
  } else {
    body.shame = null;
  }

  if (!body.category || !body.page_id || !body.title) {
    showStatus('Заполни категорию, ID и название', false);
    return;
  }

  try {
    const res = await fetch('/api/admin/wiki', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.error || 'Ошибка сохранения');
    }
    showStatus('✅ Сохранено');
    await loadList();
  } catch (e) {
    showStatus('❌ ' + e.message, false);
  }
});

document.getElementById('delete-btn').addEventListener('click', async () => {
  if (currentIdx < 0 || !currentItems[currentIdx]) return;
  const it = currentItems[currentIdx];
  if (!confirm(`Удалить «${it.title}»? Это действие необратимо.`)) return;
  try {
    const res = await fetch(`/api/admin/wiki/${it.category}/${it.page_id}`, {
      method: 'DELETE',
      credentials: 'include'
    });
    if (!res.ok) throw new Error('Ошибка удаления');
    showStatus('🗑 Удалено');
    currentIdx = -1;
    editForm.style.display = 'none';
    editorTitle.textContent = 'Выбери статью слева';
    await loadList();
  } catch (e) {
    showStatus('❌ ' + e.message, false);
  }
});

document.getElementById('new-btn').addEventListener('click', newItem);
document.getElementById('view-site-btn').addEventListener('click', () => {
  window.open('/', '_blank');
});
document.getElementById('logout-btn').addEventListener('click', async () => {
  try { await fetch('/api/admin/logout', { method: 'POST', credentials: 'include' }); } catch {}
  adminPanel.classList.add('hidden');
  loginScreen.classList.remove('hidden');
  loginInput.value = '';
  loginInput.focus();
});

(async () => {
  try {
    const res = await fetch('/api/admin/session', { credentials: 'include' });
    const d = await res.json();
    if (d.authed) {
      loginScreen.classList.add('hidden');
      adminPanel.classList.remove('hidden');
      await loadList();
    } else {
      loginInput.focus();
    }
  } catch { loginInput.focus(); }
})();
</script>
