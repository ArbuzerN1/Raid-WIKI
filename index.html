<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1a1a1a" />
<title>RAID WIKI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Segoe UI', 'Consolas', monospace, sans-serif;
  background: #1a1a1a;
  color: #e6e6e6;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ===== Фон: шум ===== */
#noise-canvas {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  z-index: 0;
  opacity: 0.18;
  pointer-events: none;
  background: radial-gradient(circle at 50% 50%, #2a2a2a 0%, #141414 100%);
}

.scanlines {
  position: fixed; inset: 0;
  z-index: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.03) 0px,
    rgba(255,255,255,0.03) 1px,
    transparent 1px,
    transparent 3px
  );
  animation: scanMove 8s linear infinite;
}
@keyframes scanMove {
  from { background-position-y: 0; }
  to   { background-position-y: 100px; }
}

/* ===== Общая обёртка ===== */
.page {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 24px 60px;
  animation: pageIn 0.6s ease both;
}
@keyframes pageIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ===== Бургер ===== */
.burger {
  display: none;
  position: fixed;
  top: 14px; left: 14px;
  z-index: 60;
  width: 46px; height: 46px;
  background: rgba(15,15,15,0.9);
  border: 1px solid #ff2b2b;
  cursor: pointer;
  padding: 0;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  transition: all 0.25s ease;
  box-shadow: 0 0 12px rgba(255,43,43,0.4);
  border-radius: 4px;
}
.burger:hover, .burger:active {
  background: #ff2b2b;
  box-shadow: 0 0 20px rgba(255,43,43,0.9);
}
.burger span {
  display: block;
  width: 22px; height: 2px;
  background: #fff;
  transition: transform 0.3s ease, opacity 0.3s ease;
}
.burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.burger.open span:nth-child(2) { opacity: 0; }
.burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 40;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.overlay.open { display: block; opacity: 1; }

/* ===== Шапка ===== */
.site-header {
  text-align: center;
  margin-bottom: 32px;
  user-select: none;
}
.title {
  position: relative;
  color: #ff2b2b;
  font-size: clamp(2rem, 8vw, 4.5rem);
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-shadow:
    0 0 8px rgba(255, 0, 0, 0.7),
    0 0 24px rgba(255, 0, 0, 0.4),
    0 0 48px rgba(255, 0, 0, 0.25);
  animation: flicker 4s infinite;
  line-height: 1.05;
  word-break: break-word;
}
.title::before,
.title::after {
  content: attr(data-text);
  position: absolute;
  inset: 0;
  color: #ff2b2b;
  pointer-events: none;
  opacity: 0;
}
.title:hover::before {
  animation: glitchTop 0.4s steps(2, end) 2;
  color: #00e5ff;
  transform: translate(-2px, -2px);
  opacity: 0.9;
}
.title:hover::after {
  animation: glitchBot 0.4s steps(2, end) 2;
  color: #ff2b2b;
  transform: translate(2px, 2px);
  opacity: 0.9;
}
@keyframes glitchTop {
  0% { clip-path: inset(0 0 80% 0); }
  50% { clip-path: inset(20% 0 40% 0); }
  100% { clip-path: inset(0 0 80% 0); }
}
@keyframes glitchBot {
  0% { clip-path: inset(70% 0 0 0); }
  50% { clip-path: inset(40% 0 20% 0); }
  100% { clip-path: inset(70% 0 0 0); }
}
@keyframes flicker {
  0%, 92%, 100% { opacity: 1; }
  93% { opacity: 0.7; }
  94% { opacity: 1; }
  96% { opacity: 0.6; }
  97% { opacity: 1; }
}

.subtitle {
  color: #888;
  font-size: clamp(0.7rem, 2vw, 0.9rem);
  letter-spacing: 0.3em;
  margin-top: 8px;
  text-transform: uppercase;
}

/* ===== Поиск ===== */
.search-wrap {
  position: relative;
  max-width: 480px;
  margin: 22px auto 0;
  padding: 0 4px;
}
.search-input {
  width: 100%;
  background: rgba(0, 0, 0, 0.55);
  border: 1px solid #444;
  color: #fff;
  padding: 12px 14px 12px 40px;
  font-family: inherit;
  font-size: 0.95rem;
  letter-spacing: 0.04em;
  transition: all 0.25s ease;
  border-radius: 4px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2'><circle cx='11' cy='11' r='7'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>");
  background-repeat: no-repeat;
  background-position: 14px center;
}
.search-input::placeholder { color: #777; }
.search-input:focus {
  outline: none;
  border-color: #ff2b2b;
  box-shadow: 0 0 14px rgba(255, 43, 43, 0.55);
  background-color: rgba(20, 0, 0, 0.7);
}
.search-results {
  position: absolute;
  top: calc(100% + 6px);
  left: 4px; right: 4px;
  background: rgba(15, 15, 15, 0.98);
  border: 1px solid #ff2b2b;
  box-shadow: 0 0 24px rgba(255, 43, 43, 0.35);
  max-height: 60vh;
  overflow-y: auto;
  z-index: 20;
  display: none;
  animation: dropIn 0.2s ease both;
  border-radius: 4px;
}
.search-results.open { display: block; }
@keyframes dropIn {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.search-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  border-bottom: 1px solid #262626;
  color: #e6e6e6;
  padding: 12px 14px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.92rem;
  transition: all 0.15s ease;
}
.search-item:last-child { border-bottom: none; }
.search-item:hover,
.search-item.active {
  background: rgba(255, 43, 43, 0.15);
  color: #fff;
  padding-left: 20px;
  border-left: 3px solid #ff2b2b;
}
.search-item .search-avatar {
  flex-shrink: 0;
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid #ff2b2b;
  background: #0f0f0f;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  overflow: hidden;
  box-shadow: 0 0 6px rgba(255,43,43,0.4);
}
.search-item .search-avatar img { width: 100%; height: 100%; object-fit: cover; }
.search-item .search-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.search-item .cat-tag {
  font-size: 0.68rem;
  color: #999;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  white-space: nowrap;
}
.search-item mark {
  background: rgba(255, 43, 43, 0.35);
  color: #fff;
  padding: 0 2px;
}
.search-empty {
  padding: 14px;
  color: #888;
  font-style: italic;
  text-align: center;
  font-size: 0.9rem;
}

/* ===== Раскладка ===== */
.layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 24px;
  align-items: start;
}

/* ===== Каталог ===== */
.sidebar {
  border: 1px solid #fff;
  padding: 16px;
  background: rgba(20, 20, 20, 0.55);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  animation: slideLeft 0.6s 0.1s ease both;
  position: sticky;
  top: 24px;
}
@keyframes slideLeft {
  from { opacity: 0; transform: translateX(-14px); }
  to   { opacity: 1; transform: translateX(0); }
}
.sidebar-title {
  color: #ff2b2b;
  font-size: 1.1rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  border-bottom: 1px solid #444;
  padding-bottom: 8px;
  margin-bottom: 12px;
}
.catalog { list-style: none; }
.catalog > li { margin-bottom: 10px; }
.catalog-btn {
  width: 100%;
  text-align: left;
  background: transparent;
  border: 1px solid #555;
  color: #fff;
  padding: 10px 14px;
  font-size: 0.95rem;
  cursor: pointer;
  letter-spacing: 0.05em;
  transition: all 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
  position: relative;
  overflow: hidden;
  border-radius: 3px;
  font-family: inherit;
}
.catalog-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,43,43,0.5), transparent);
  transform: translateX(-100%);
  transition: transform 0.4s ease;
}
.catalog-btn:hover::before { transform: translateX(100%); }
.catalog-btn:hover,
.catalog-btn.active {
  background: #ff2b2b;
  border-color: #ff2b2b;
  color: #fff;
  box-shadow: 0 0 12px rgba(255, 43, 43, 0.6);
  transform: translateX(3px);
}
.catalog-list {
  list-style: none;
  margin: 6px 0 0 10px;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}
.catalog-list.open { max-height: 1000px; }
.catalog-list li {
  opacity: 0;
  transform: translateX(-8px);
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.catalog-list.open li { opacity: 1; transform: translateX(0); }
.catalog-list.open li:nth-child(1) { transition-delay: 0.05s; }
.catalog-list.open li:nth-child(2) { transition-delay: 0.10s; }
.catalog-list.open li:nth-child(3) { transition-delay: 0.15s; }
.catalog-list.open li:nth-child(4) { transition-delay: 0.20s; }
.catalog-list.open li:nth-child(5) { transition-delay: 0.25s; }
.catalog-list.open li:nth-child(6) { transition-delay: 0.30s; }
.catalog-list.open li:nth-child(7) { transition-delay: 0.35s; }
.catalog-list.open li:nth-child(8) { transition-delay: 0.40s; }
.catalog-list li button {
  display: flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: none;
  color: #cfcfcf;
  font-size: 0.88rem;
  padding: 8px 6px;
  cursor: pointer;
  text-align: left;
  width: 100%;
  border-left: 2px solid #333;
  transition: all 0.2s ease;
  font-family: inherit;
}
.catalog-list li button:hover {
  color: #ff2b2b;
  border-left-color: #ff2b2b;
  padding-left: 10px;
  background: rgba(255, 43, 43, 0.08);
}
.catalog-avatar {
  flex-shrink: 0;
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 1px solid #555;
  background: #0f0f0f;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  overflow: hidden;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.catalog-list li button:hover .catalog-avatar {
  border-color: #ff2b2b;
  box-shadow: 0 0 8px rgba(255,43,43,0.6);
}
.catalog-avatar img { width: 100%; height: 100%; object-fit: cover; }

/* ===== Контент ===== */
.content { min-height: 400px; }
.framed {
  position: relative;
  border: 1px solid #fff;
  padding: 28px;
  background: rgba(15, 15, 15, 0.55);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  color: #fff;
  line-height: 1.6;
  min-height: 300px;
  animation: slideRight 0.6s 0.15s ease both;
}
@keyframes slideRight {
  from { opacity: 0; transform: translateX(14px); }
  to   { opacity: 1; transform: translateX(0); }
}
.framed::before,
.framed::after {
  content: "";
  position: absolute;
  width: 14px;
  height: 14px;
  border: 2px solid #ff2b2b;
  pointer-events: none;
  transition: all 0.3s ease;
}
.framed::before {
  top: -1px; left: -1px;
  border-right: none; border-bottom: none;
}
.framed::after {
  bottom: -1px; right: -1px;
  border-left: none; border-top: none;
}
.framed:hover::before,
.framed:hover::after {
  width: 26px;
  height: 26px;
  box-shadow: 0 0 14px rgba(255, 43, 43, 0.7);
}

.content-anim {
  animation: contentIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
@keyframes contentIn {
  from { opacity: 0; transform: translateY(10px) scale(0.99); filter: blur(2px); }
  to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}
.content-anim.fade-out {
  animation: contentOut 0.25s ease both;
}
@keyframes contentOut {
  from { opacity: 1; transform: translateY(0); filter: blur(0); }
  to   { opacity: 0; transform: translateY(-8px); filter: blur(3px); }
}

/* Шапка страницы с аватаркой */
.page-hero {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 22px;
}
.page-avatar {
  flex-shrink: 0;
  width: 72px; height: 72px;
  border-radius: 50%;
  border: 2px solid #ff2b2b;
  background: #0f0f0f;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  overflow: hidden;
  box-shadow:
    0 0 16px rgba(255,43,43,0.6),
    0 0 32px rgba(255,43,43,0.25);
  animation: avatarPulse 3s ease-in-out infinite;
}
@keyframes avatarPulse {
  0%, 100% { box-shadow: 0 0 16px rgba(255,43,43,0.6), 0 0 32px rgba(255,43,43,0.25); }
  50%      { box-shadow: 0 0 22px rgba(255,43,43,0.9), 0 0 44px rgba(255,43,43,0.45); }
}
.page-avatar img { width: 100%; height: 100%; object-fit: cover; }
.page-heading { flex: 1; min-width: 0; }
.page-heading h2 {
  color: #ff2b2b;
  font-size: clamp(1.3rem, 4vw, 1.8rem);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  word-break: break-word;
}
.page-heading h2::after {
  content: "";
  display: block;
  width: 60px;
  height: 2px;
  background: #ff2b2b;
  margin-top: 8px;
  box-shadow: 0 0 10px rgba(255, 43, 43, 0.8);
  animation: lineGrow 0.5s ease both;
}
.page-heading .page-cat {
  font-size: 0.72rem;
  color: #999;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-top: 6px;
}
@keyframes lineGrow {
  from { width: 0; }
  to   { width: 60px; }
}

.framed p { margin-bottom: 12px; color: #eaeaea; word-wrap: break-word; }
.framed .test-text {
  font-size: clamp(1rem, 3vw, 1.25rem);
  font-weight: 700;
  color: #fff;
  margin: 20px 0;
  text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
}

/* Список страниц категории */
.page-list {
  list-style: none;
  display: grid;
  gap: 10px;
  margin-top: 14px;
}
.page-list li {
  opacity: 0;
  transform: translateY(8px);
  animation: pageItemIn 0.4s ease forwards;
}
.page-list li:nth-child(1) { animation-delay: 0.05s; }
.page-list li:nth-child(2) { animation-delay: 0.1s; }
.page-list li:nth-child(3) { animation-delay: 0.15s; }
.page-list li:nth-child(4) { animation-delay: 0.2s; }
.page-list li:nth-child(5) { animation-delay: 0.25s; }
.page-list li:nth-child(6) { animation-delay: 0.3s; }
@keyframes pageItemIn {
  to { opacity: 1; transform: translateY(0); }
}
.page-list .catalog-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
}
.page-list .catalog-avatar {
  width: 38px; height: 38px;
  font-size: 20px;
  border-color: #ff2b2b;
  box-shadow: 0 0 8px rgba(255,43,43,0.5);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.page-list .catalog-btn:hover .catalog-avatar {
  transform: scale(1.08);
  box-shadow: 0 0 14px rgba(255,43,43,0.9);
}
.page-list .catalog-btn span:last-child {
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.04em;
}

.site-footer {
  text-align: center;
  color: #555;
  font-size: 0.8rem;
  letter-spacing: 0.2em;
  margin-top: 40px;
}

/* =========================================================
   АДАПТИВ
   ========================================================= */

@media (max-width: 1024px) {
  .page { padding: 28px 20px 50px; }
  .layout { grid-template-columns: 220px 1fr; gap: 20px; }
  .sidebar { padding: 14px; }
  .framed { padding: 24px; }
  .page-avatar { width: 64px; height: 64px; font-size: 30px; }
}

@media (max-width: 820px) {
  .burger { display: flex; }
  .layout { grid-template-columns: 1fr; gap: 0; }

  .sidebar {
    position: fixed;
    top: 0; left: 0;
    width: min(320px, 85vw);
    height: 100vh;
    height: 100dvh;
    z-index: 50;
    background: rgba(12, 12, 12, 0.98);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: none;
    border-right: 2px solid #ff2b2b;
    padding: 76px 20px 30px;
    transform: translateX(-105%);
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    animation: none;
    box-shadow: 0 0 40px rgba(255,43,43,0.4);
    border-radius: 0;
    position: fixed;
  }
  .sidebar.open { transform: translateX(0); }

  .page { padding: 76px 16px 50px; }
  .site-header { margin-bottom: 24px; }
  .search-wrap { margin-top: 18px; }
  .framed { padding: 22px 18px; }
  .framed h2 { font-size: 1.4rem; }
}

@media (max-width: 560px) {
  .page { padding: 70px 12px 40px; }

  .title {
    font-size: clamp(1.9rem, 11vw, 2.8rem);
    letter-spacing: 0.05em;
  }
  .subtitle { font-size: 0.68rem; letter-spacing: 0.2em; }

  .search-wrap { margin-top: 16px; }
  .search-input {
    padding: 11px 12px 11px 38px;
    font-size: 0.9rem;
    background-position: 12px center;
  }
  .search-results { max-height: 65vh; }
  .search-item { padding: 11px 12px; font-size: 0.88rem; }
  .search-item .cat-tag { display: none; }

  .page-hero { gap: 12px; margin-bottom: 18px; }
  .page-avatar {
    width: 54px; height: 54px;
    font-size: 24px;
    border-width: 2px;
  }
  .page-heading h2 { font-size: 1.2rem; }
  .page-heading .page-cat { font-size: 0.65rem; letter-spacing: 0.15em; }

  .framed { padding: 18px 14px; min-height: 250px; }
  .framed::before,
  .framed::after { width: 12px; height: 12px; }
  .framed .test-text { font-size: 1rem; margin: 16px 0; }

  .page-list .catalog-btn { padding: 10px 12px; gap: 10px; }
  .page-list .catalog-avatar { width: 34px; height: 34px; font-size: 18px; }
  .page-list .catalog-btn span:last-child { font-size: 0.95rem; }

  .sidebar { padding: 70px 16px 24px; }
  .site-footer { font-size: 0.7rem; margin-top: 30px; }
}

@media (max-width: 380px) {
  .title { font-size: 1.7rem; }
  .page-avatar { width: 46px; height: 46px; font-size: 20px; }
  .page-heading h2 { font-size: 1.05rem; }
  .framed { padding: 16px 12px; }
}

@media (min-width: 1440px) {
  .page { max-width: 1300px; padding: 40px 32px 80px; }
  .layout { grid-template-columns: 280px 1fr; gap: 28px; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  #noise-canvas { display: none; }
}
</style>
</head>
<body>
  <canvas id="noise-canvas"></canvas>
  <div class="scanlines"></div>

  <button class="burger" id="burger" aria-label="Меню">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="overlay" id="overlay"></div>

  <div class="page">
    <header class="site-header">
      <h1 class="title" data-text="RAID WIKI">RAID WIKI</h1>
      <p class="subtitle">// рейдеры и антирейдеры MAX</p>

      <div class="search-wrap">
        <input type="text" id="search-input" class="search-input"
               placeholder="Поиск по базе... (Ctrl+K)" autocomplete="off" />
        <div class="search-results" id="search-results"></div>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <h2 class="sidebar-title">Каталог</h2>
        <ul class="catalog">
          <li>
            <button class="catalog-btn" data-category="raiders">Рейдеры</button>
            <ul class="catalog-list" id="list-raiders"></ul>
          </li>
          <li>
            <button class="catalog-btn" data-category="antiraiders">Антирейдеры</button>
            <ul class="catalog-list" id="list-antiraiders"></ul>
          </li>
        </ul>
      </aside>

      <main class="content">
        <div class="framed" id="content-frame"></div>
      </main>
    </div>

    <footer class="site-footer">
      <span>© RAID WIKI</span>
    </footer>
  </div>

<script>
/* =====================================================
   ДАННЫЕ ВИКИ
   avatar — emoji или URL картинки
   ===================================================== */
const WIKI = {
  raiders: [
    {
      id: 'uotb',
      title: 'UOTB',
      avatar: 'https://files.catbox.moe/q7umsu.jpg',
      content: `
        <p class="test-text">Кто такие UOTB?</p>
        <p>UOTB, или же «Union Of The Brash» — первые рейдеры в максе. Данной
        группировке более 4-ех лет и находились они до MAX'а в Viber и Telegram.
        Нынешний владелец UOTB — Пабло. Именно с них началось рейдерство в MAX'е.</p>
      `
    },
    {
      id: 'mars',
      title: 'MARS',
      avatar: 'https://files.catbox.moe/yxog2w.jpg',
      content: `
        <p class="test-text">Кто такие MARS?</p>
        <p>MARS — крупнейший подклан UOTB, занимается он в основном шпионством,
        но они также и рейдеры. Нынешний владелец — SPAWN. На данный момент
        в чате адаптации MARS'а 650+ участников.</p>
      `
    }
  ],
  antiraiders: [
    {
      id: 'ftaj',
      title: 'FTAJ',
      avatar: 'https://files.catbox.moe/mbyyig.jpg',
      content: `
        <p class="test-text">Кто такие FTAJ?</p>
        <p>FTAJ — вторые рейдеры (на данный момент антирейдеры) в MAX'е.
        Их нынешний создатель — даник. Сейчас занимаются антирейдерством,
        уничтожают неизвестные и мелкие рейдерские группировки,
        а также конфликтуют с существуещими крупными.</p>
      `
    },
    {
      id: 'tspr',
      title: 'ЦПР',
      avatar: 'https://files.catbox.moe/selzzf.jpg',
      content: `
        <p class="test-text">Кто такие ЦПР?</p>
        <p>ЦПР, или же Центр Противодействия Рейдерам — первая антирейдерская
        группировка. Нынешний создатель — shalow dern (или же шейд). ЦПР создавался
        просто канал против обмана со стороны UOTB, но потом перерос в более крупный
        проект по сливам рейдеров, и их уничтожению. Были созданы в один день с KR.</p>
      `
    },
    {
      id: 'kr',
      title: 'KR',
      avatar: 'https://files.catbox.moe/d94th3.jpg',
      content: `
        <p class="test-text">Кто такие KR?</p>
        <p>KR — бывшие рейдеры, на данный момент антирейдеры. Самые известные
        свежаки среди всех. Были созданы в один день с ЦПР. Их нынешний владелец —
        user (или же Крутой Челик, зависит от акка).</p>
      `
    }
  ]
};

const CATEGORY_LABEL = { raiders: 'Рейдеры', antiraiders: 'Антирейдеры' };

const contentFrame = document.getElementById('content-frame');
const listRaiders = document.getElementById('list-raiders');
const listAntiraiders = document.getElementById('list-antiraiders');
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
const sidebar = document.getElementById('sidebar');
const burger = document.getElementById('burger');
const overlay = document.getElementById('overlay');

/* Хелперы для аватарок */
function isImageUrl(s) {
  return typeof s === 'string' && /^(https?:)?\/\//i.test(s);
}
function renderAvatar(value, fallback = '❓') {
  if (!value) return fallback;
  if (isImageUrl(value)) {
    return `<img src="${escapeHtml(value)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${fallback}'))" />`;
  }
  return escapeHtml(value);
}

/* Смена контента */
function setContent(html) {
  if (contentFrame.innerHTML.trim()) {
    contentFrame.classList.remove('content-anim');
    contentFrame.classList.add('content-anim', 'fade-out');
    setTimeout(() => {
      contentFrame.classList.remove('fade-out');
      contentFrame.innerHTML = html;
      void contentFrame.offsetWidth;
      contentFrame.classList.add('content-anim');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 250);
  } else {
    contentFrame.innerHTML = html;
    contentFrame.classList.add('content-anim');
  }
}

function renderHome() {
  setContent(`
    <p>Здравствуйте, вы попали на сайт: «Raid WIKI», здесь вы можете ознакомиться
    со всеми известными рейдерами/антирейдерами приложения "MAX".
    Если вам интересно знать что-то о них — то вам именно сюда!</p>
    <p style="color:#888; margin-top:14px; font-size:0.9rem;">
      Используйте каталог слева или поиск сверху, чтобы найти нужного рейдера.
    </p>
  `);
}

function renderCategory(category) {
  const items = WIKI[category] || [];
  const label = CATEGORY_LABEL[category];

  let html = `<h2>${label}</h2>`;
  if (!items.length) {
    html += `<p style="color:#777; font-style:italic;">Пока здесь пусто...</p>`;
  } else {
    html += `<ul class="page-list">`;
    items.forEach(p => {
      html += `<li>
        <button class="catalog-btn" data-page="${p.id}" data-category="${category}">
          <span class="catalog-avatar">${renderAvatar(p.avatar || p.icon)}</span>
          <span>${escapeHtml(p.title)}</span>
        </button>
      </li>`;
    });
    html += `</ul>`;
  }

  setContent(html);
  setTimeout(() => {
    contentFrame.querySelectorAll('button[data-page]').forEach(btn => {
      btn.addEventListener('click', () => renderPage(btn.dataset.category, btn.dataset.page));
    });
  }, 260);
}

function renderPage(category, pageId) {
  const page = (WIKI[category] || []).find(p => p.id === pageId);
  if (!page) {
    setContent(`<h2>Не найдено</h2><p>Такой страницы нет.</p>`);
    return;
  }
  const avatarHtml = renderAvatar(page.avatar || page.icon);
  setContent(`
    <div class="page-hero">
      <div class="page-avatar">${avatarHtml}</div>
      <div class="page-heading">
        <h2>${escapeHtml(page.title)}</h2>
        <div class="page-cat">${CATEGORY_LABEL[category]}</div>
      </div>
    </div>
    ${page.content}
  `);
}

/* Поиск */
function getAllPages() {
  const all = [];
  for (const cat of Object.keys(WIKI)) {
    for (const page of WIKI[cat]) all.push({ ...page, category: cat });
  }
  return all;
}

function searchPages(query) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  return getAllPages()
    .map(p => {
      const title = p.title.toLowerCase();
      const text = stripHtml(p.content).toLowerCase();
      let score = 0;
      if (title.includes(q)) score += 10;
      if (title.startsWith(q)) score += 5;
      if (text.includes(q)) score += 2;
      return { ...p, score };
    })
    .filter(p => p.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 8);
}

function stripHtml(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || '';
}

function highlight(text, query) {
  if (!query) return escapeHtml(text);
  const safe = escapeHtml(text);
  const q = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp(`(${q})`, 'ig'), '<mark>$1</mark>');
}

let activeSearchIndex = -1;

function renderSearchResults(query) {
  const results = searchPages(query);
  activeSearchIndex = -1;
  if (!query.trim()) {
    searchResults.classList.remove('open');
    searchResults.innerHTML = '';
    return;
  }
  if (!results.length) {
    searchResults.innerHTML = `<div class="search-empty">Ничего не найдено</div>`;
    searchResults.classList.add('open');
    return;
  }
  searchResults.innerHTML = results.map(p => `
    <button class="search-item" data-category="${p.category}" data-page="${p.id}">
      <span class="search-avatar">${renderAvatar(p.avatar || p.icon)}</span>
      <span class="search-title">${highlight(p.title, query)}</span>
      <span class="cat-tag">${CATEGORY_LABEL[p.category]}</span>
    </button>
  `).join('');
  searchResults.classList.add('open');

  searchResults.querySelectorAll('.search-item').forEach(btn => {
    btn.addEventListener('click', () => {
      renderPage(btn.dataset.category, btn.dataset.page);
      searchResults.classList.remove('open');
      searchInput.value = '';
      searchInput.blur();
      closeSidebar();
    });
  });
}

searchInput.addEventListener('input', e => renderSearchResults(e.target.value));
searchInput.addEventListener('focus', e => {
  if (e.target.value.trim()) searchResults.classList.add('open');
});

searchInput.addEventListener('keydown', e => {
  const items = searchResults.querySelectorAll('.search-item');
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    activeSearchIndex = (activeSearchIndex + 1) % items.length;
    updateActive(items);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    activeSearchIndex = (activeSearchIndex - 1 + items.length) % items.length;
    updateActive(items);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    (activeSearchIndex >= 0 ? items[activeSearchIndex] : items[0])?.click();
  } else if (e.key === 'Escape') {
    searchResults.classList.remove('open');
    searchInput.blur();
  }
});

function updateActive(items) {
  items.forEach((it, i) => it.classList.toggle('active', i === activeSearchIndex));
  items[activeSearchIndex]?.scrollIntoView({ block: 'nearest' });
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) searchResults.classList.remove('open');
});

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  }
});

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

/* Каталог */
function fillCatalog() {
  listRaiders.innerHTML = WIKI.raiders.map(p =>
    `<li>
      <button data-page="${p.id}" data-category="raiders">
        <span class="catalog-avatar">${renderAvatar(p.avatar || p.icon)}</span>
        <span>${escapeHtml(p.title)}</span>
      </button>
    </li>`
  ).join('');
  listAntiraiders.innerHTML = WIKI.antiraiders.map(p =>
    `<li>
      <button data-page="${p.id}" data-category="antiraiders">
        <span class="catalog-avatar">${renderAvatar(p.avatar || p.icon)}</span>
        <span>${escapeHtml(p.title)}</span>
      </button>
    </li>`
  ).join('');
  document.querySelectorAll('.catalog-list button').forEach(btn => {
    btn.addEventListener('click', () => {
      renderPage(btn.dataset.category, btn.dataset.page);
      closeSidebar();
    });
  });
}

document.querySelectorAll('.catalog-btn[data-category]').forEach(btn => {
  btn.addEventListener('click', () => {
    const cat = btn.dataset.category;
    const isOpen = btn.classList.contains('active');
    document.querySelectorAll('.catalog-btn[data-category]').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.catalog-list').forEach(l => l.classList.remove('open'));
    if (!isOpen) {
      btn.classList.add('active');
      document.getElementById(cat === 'raiders' ? 'list-raiders' : 'list-antiraiders')
        .classList.add('open');
      renderCategory(cat);
    } else renderHome();
  });
});

/* Мобильное меню */
function openSidebar() {
  sidebar.classList.add('open');
  overlay.classList.add('open');
  burger.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSidebar() {
  sidebar.classList.remove('open');
  overlay.classList.remove('open');
  burger.classList.remove('open');
  document.body.style.overflow = '';
}
burger.addEventListener('click', () => {
  if (sidebar.classList.contains('open')) closeSidebar();
  else openSidebar();
});
overlay.addEventListener('click', closeSidebar);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSidebar();
});

/* Шум */
(function initNoise() {
  const canvas = document.getElementById('noise-canvas');
  const ctx = canvas.getContext('2d');
  let w, h, frame = 0;
  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  function draw() {
    if (frame % 2 === 0) {
      const img = ctx.createImageData(w, h);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = (Math.random() * 255) | 0;
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = 40;
      }
      ctx.putImageData(img, 0, 0);
    }
    frame++;
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize();
  draw();
})();

/* Старт */
fillCatalog();
renderHome();
</script>
</body>
</html>
